name: Script checks (no PHP compilation)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell syntax
        run: bash -n build.sh scripts/container.sh scripts/native.sh
      - name: Check Python syntax and behavior
        run: |
          python3 -m compileall -q scripts tools tests validation
          python3 -m unittest discover -s tests -v
      - name: Plan all targets (no downloads or compilation)
        run: ./build.sh --ubuntu all --plan
